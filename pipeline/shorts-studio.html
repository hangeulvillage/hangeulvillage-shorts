:root {

:root[data-theme="dark"] {

  --cho: #7aa2ea; --jung: #f07a6e; --jong: #e8bb4e; --good: #5cc28a; --warn: #e8bb4e; --focus: #7aa2ea; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

const V_LIST = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'.split('');
const T_LIST = ['', ...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'.split('')];
const L_ROM = ['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
const V_ROM = ['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
const T_ROM = {'':'','ㄱ':'k','ㄲ':'k','ㄴ':'n','ㄷ':'t','ㄹ':'l','ㅁ':'m','ㅂ':'p','ㅅ':'t','ㅆ':'t','ㅇ':'ng','ㅈ':'t','ㅊ':'t','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'t'};

function compose(L, V, T) {
  const li = L_LIST.indexOf(L), vi = V_LIST.indexOf(V), ti = T_LIST.indexOf(T || '');
  if (li < 0 || vi < 0 || ti < 0) return null;
  return String.fromCharCode(0xAC00 + (li * 21 + vi) * 28 + ti);
}
function decompose(ch) {
  const c = ch.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return null;
  const L = L_LIST[Math.floor(c / 588)], V = V_LIST[Math.floor((c % 588) / 28)], T = T_LIST[c % 28];
  return { L, V, T, rom: L_ROM[Math.floor(c / 588)] + V_ROM[Math.floor((c % 588) / 28)] + T_ROM[T] };
}

    const ta = $(b.dataset.copy);
    const ok = () => setStatus('복사했습니다.');
    const fb = () => { ta.focus(); ta.select(); setStatus('선택했습니다. Ctrl+C로 복사하세요.'); };
    try { navigator.clipboard.writeText(ta.value).then(ok, fb); } catch (e) { fb(); }
  }));
  $('shuffle').addEventListener('click', () => { seed = (seed + 7) % 233280; buildPackage(); });

  function refresh() {
    parseNames();
    plan = buildPlan();
    buildPackage();
    if (!raf) stillFrame();
  }
  $('names').addEventListener('input', () => { clearTimeout(refresh._t); refresh._t = setTimeout(refresh, 250); });
  document.querySelectorAll('input[name=fmt]').forEach(r => r.addEventListener('change', () => { fmt = r.value; seed = 1; refresh(); }));

  // ---------- tracker (db) ----------
  let shorts = [], reqs = [];
  const GOAL_VIEWS = 10000, GOAL_POSTS = 10, GATE = '2026-11-13';
  async function addLog(fromSave) {
    if (!db) { if (!fromSave) setStatus('관리 기록은 claude.ai에 로그인한 상태에서만 저장됩니다.'); return; }
    if (!items.length) return;
    try {
      await db.collection('shorts').add({
        createdAt: new Date().toISOString(), format: fmt,
        names: items.map(i => ({ en: i.en, ko: i.ko, handle: i.handle || '' })),
        title: $('p-title').value, status: 'made', platforms: { yt: false, tt: false, ig: false }, views: 0, comments: 0, url: ''
      });
      // mark used requests as done
      for (const it of items) {
        const r = reqs.find(q => !q.done && q.name.toLowerCase() === it.en.toLowerCase());
        if (r) await db.doc('requests/' + r.id).update({ done: true });
      }
      if (!fromSave) setStatus('관리 목록에 추가했습니다.');
    } catch (e) { setStatus('기록하지 못했습니다 (' + (e && e.code || 'error') + ').'); }
  }
  $('log-add').addEventListener('click', () => addLog(false));

  function renderStrip() {
    const best = shorts.reduce((m, s) => Math.max(m, Number(s.views) || 0), 0);
    const totalViews = shorts.reduce((m, s) => m + (Number(s.views) || 0), 0);
    const posted = shorts.filter(s => s.status === 'posted').length;
    const reqCount = reqs.length;
    const days = Math.floor((Date.parse(GATE + 'T23:59:59+09:00') - Date.now()) / 864e5);
    const pass = best >= GOAL_VIEWS;
    const strip = $('strip'); strip.textContent = '';
    const add = (k, v, sub, ratio, ok) => {
      const d = document.createElement('div'); d.className = 'stat';
      const kk = document.createElement('div'); kk.className = 'k'; kk.textContent = k;
      const vv = document.createElement('div'); vv.className = 'v'; vv.textContent = v;
      if (sub) { const sm = document.createElement('small'); sm.textContent = ' ' + sub; vv.appendChild(sm); }
      d.append(kk, vv);
      if (ratio != null) { const b = document.createElement('div'); b.className = 'bar' + (ok ? ' ok' : ''); const i = document.createElement('i'); i.style.width = clamp(ratio, 0, 1) * 100 + '%'; b.appendChild(i); d.appendChild(b); }
      strip.appendChild(d);
    };
    add('최고 조회수', best.toLocaleString(), '/ 10,000', best / GOAL_VIEWS, pass);
    add('업로드한 쇼츠', String(posted), '/ ' + GOAL_POSTS + '편', posted / GOAL_POSTS, posted >= GOAL_POSTS);
    add('이름 요청', String(reqCount), '건 (누적)', null);
    const d = document.createElement('div'); d.className = 'stat';
    const k = document.createElement('div'); k.className = 'k'; k.textContent = '관문까지';
    const v = document.createElement('div'); v.className = 'v'; v.textContent = days > 0 ? 'D-' + days : days === 0 ? 'D-day' : '판정 완료';
    const pill = document.createElement('span'); pill.className = 'pill ' + (pass ? 'ok' : 'wait'); pill.textContent = pass ? '통과 기준 달성' : '진행 중';
    const tv = document.createElement('div'); tv.className = 'sub'; tv.textContent = '총 조회수 ' + totalViews.toLocaleString();
    d.append(k, v, pill, tv); strip.appendChild(d);
  }

  function renderShorts() {
    const wrap = $('shorts-wrap'); wrap.textContent = '';
    if (!shorts.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = '아직 기록이 없습니다. 만들기 탭에서 영상을 저장하면 여기에 자동으로 추가됩니다.'; wrap.appendChild(e); return; }
    const tb = document.createElement('table');
    tb.innerHTML = '<thead><tr><th>만든 날</th><th>형식</th><th>이름</th><th>올린 곳</th><th>상태</th><th>조회수</th><th>댓글</th><th>링크</th><th></th></tr></thead>';
    const body = document.createElement('tbody');
    shorts.forEach(s => {
      const tr = document.createElement('tr');
      const td = c => { const x = document.createElement('td'); if (c) x.className = c; tr.appendChild(x); return x; };
      td().textContent = (s.createdAt || '').slice(5, 10).replace('-', '/');
      td().textContent = s.format || '';
      const nm = td(); nm.className = 'ko'; nm.textContent = (s.names || []).map(n => n.ko).join(', ');
      nm.title = (s.names || []).map(n => n.en).join(', ');
      const pl = td(); const pd = document.createElement('div'); pd.className = 'plat';
      [['yt', '유튜브'], ['tt', '틱톡'], ['ig', '인스타']].forEach(([key, lab]) => {
        const l = document.createElement('label'); const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!(s.platforms && s.platforms[key]);
        cb.id = 'pl-' + s.id + '-' + key;
        cb.addEventListener('change', () => {
          const p = Object.assign({ yt: false, tt: false, ig: false }, s.platforms || {}); p[key] = cb.checked;
          const any = p.yt || p.tt || p.ig;
          save(s.id, { platforms: p, status: any ? 'posted' : 'made' });
        });
        l.append(cb, document.createTextNode(lab)); pd.appendChild(l);
      });
      pl.appendChild(pd);
      const st = td(); const pill = document.createElement('span'); pill.className = 'pill ' + (s.status === 'posted' ? 'ok' : 'wait'); pill.textContent = s.status === 'posted' ? '업로드됨' : '제작됨'; st.appendChild(pill);
      ['views', 'comments'].forEach(f => {
        const c = td('num'); const inp = document.createElement('input'); inp.type = 'number'; inp.min = '0'; inp.value = Number(s[f]) || 0; inp.id = f + '-' + s.id;
        inp.setAttribute('aria-label', f === 'views' ? '조회수' : '댓글 수');
        inp.addEventListener('change', () => save(s.id, { [f]: Math.max(0, Number(inp.value) || 0) }));
        c.appendChild(inp);
      });
      const u = td(); const ui = document.createElement('input'); ui.className = 'url'; ui.placeholder = 'https://'; ui.value = s.url || ''; ui.id = 'url-' + s.id; ui.setAttribute('aria-label', '영상 링크');
      ui.addEventListener('change', () => save(s.id, { url: ui.value.trim() })); u.appendChild(ui);
      const del = td(); const db2 = document.createElement('button'); db2.type = 'button'; db2.className = 'ghost'; db2.textContent = '삭제';
      let armed = false;
      db2.addEventListener('click', () => { if (!armed) { armed = true; db2.textContent = '정말 삭제'; setTimeout(() => { armed = false; db2.textContent = '삭제'; }, 3000); return; } db.doc('shorts/' + s.id).delete().catch(() => {}); });
      del.appendChild(db2);
      body.appendChild(tr);
    });
    tb.appendChild(body); wrap.appendChild(tb);
  }
  async function save(id, patch) { try { await db.doc('shorts/' + id).update(patch); } catch (e) { setStatus('저장하지 못했습니다.'); } }

  const picked = new Set();
  function renderReqs() {
    const ul = $('reqs'); ul.textContent = '';
    if (!reqs.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = '댓글로 받은 이름을 여기에 모아 두세요.'; ul.appendChild(li); return; }
    reqs.forEach(r => {
      const li = document.createElement('li'); if (r.done) li.className = 'done';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'rq-' + r.id; cb.checked = picked.has(r.id); cb.disabled = !!r.done; cb.setAttribute('aria-label', r.name + ' 선택');
      cb.addEventListener('change', () => { cb.checked ? picked.add(r.id) : picked.delete(r.id); });
      const who = document.createElement('div'); who.className = 'who';
      const ko = toHangul(r.name).ko;
      who.textContent = r.name + ' '; const k = document.createElement('span'); k.className = 'ko'; k.textContent = ko; who.appendChild(k);
      if (r.handle) { const sm = document.createElement('small'); sm.textContent = r.handle; who.appendChild(sm); }
      const a = document.createElement('button'); a.type = 'button'; a.className = 'ghost'; a.textContent = 'A형 만들기';
      a.disabled = !!r.done;
      a.addEventListener('click', () => { setFormat('A'); $('names').value = r.name + (r.handle ? ' ' + r.handle : ''); refresh(); location.hash = '#create'; });
      const d = document.createElement('button'); d.type = 'button'; d.className = 'ghost'; d.textContent = r.done ? '되돌리기' : '완료';
      d.addEventListener('click', () => db.doc('requests/' + r.id).update({ done: !r.done }).catch(() => {}));
      const x = document.createElement('button'); x.type = 'button'; x.className = 'ghost'; x.textContent = '삭제'; x.setAttribute('aria-label', r.name + ' 삭제');
      x.addEventListener('click', () => db.doc('requests/' + r.id).delete().catch(() => {}));
      li.append(cb, who, a, d, x); ul.appendChild(li);
    });
  }
  function setFormat(f) { fmt = f; document.querySelectorAll('input[name=fmt]').forEach(r => r.checked = r.value === f); }
  $('req-make').addEventListener('click', () => {
    const sel = reqs.filter(r => picked.has(r.id) && !r.done).slice(0, 3);
    if (!sel.length) { setStatus('대기열에서 이름을 1~3개 선택하세요.'); location.hash = '#track'; return; }
    setFormat('C'); $('names').value = sel.map(r => r.name + (r.handle ? ' ' + r.handle : '')).join('\n');
    picked.clear(); refresh(); location.hash = '#create';
  });
  $('req-form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = cap($('req-name').value.trim().replace(/\s+/g, ' ')); let handle = $('req-handle').value.trim();
    if (!name) return;
    if (handle && !handle.startsWith('@')) handle = '@' + handle;
    if (!db) { setStatus('관리 기록은 claude.ai에 로그인한 상태에서만 저장됩니다.'); return; }
    try { await db.collection('requests').add({ name, handle, createdAt: new Date().toISOString(), done: false }); $('req-name').value = ''; $('req-handle').value = ''; $('req-name').focus(); }
    catch (err) { setStatus('추가하지 못했습니다 (' + (err && err.code || 'error') + ').'); }
  });

  function startDb(d) {
    db = d;
    db.collection('shorts').orderBy('createdAt', 'desc').onSnapshot(snap => {
      shorts = snap.docs.map(x => Object.assign({ id: x.id }, x.data()));
      renderShorts(); renderStrip();
    }, () => { $('offline').hidden = false; });
    db.collection('requests').orderBy('createdAt', 'desc').onSnapshot(snap => {
      reqs = snap.docs.map(x => Object.assign({ id: x.id }, x.data()));
      renderReqs(); renderStrip();
    }, () => {});
  }

  // ---------- tabs ----------
  function route() {
    const h = location.hash === '#track' ? 'track' : 'create';
    $('view-create').hidden = h !== 'create'; $('view-track').hidden = h !== 'track';
    $('tab-create').toggleAttribute('aria-current', false); $('tab-track').toggleAttribute('aria-current', false);
    $('tab-' + h).setAttribute('aria-current', 'page');
  }
  window.addEventListener('hashchange', route);
  route();

  // ---------- boot ----------
  renderShorts(); renderReqs(); renderStrip();
  const fontsReady = (document.fonts && document.fonts.load) ? Promise.all([
    document.fonts.load('700 100px "Gowun Batang"', '소피아제임스'),
    document.fonts.load('700 40px "Noto Sans KR"', 'ㅅㅗㅍㅣ'),
    document.fonts.load('800 60px "Bricolage Grotesque"', 'Comment')
  ]).catch(() => {}) : Promise.resolve();
  refresh();
  fontsReady.then(() => { if (!raf) stillFrame(); });
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
    window.claude.use('db').then(d => { if (d) startDb(d); else $('offline').hidden = false; }).catch(() => { $('offline').hidden = false; });
  } else { $('offline').hidden = false; }
})();
</script>
